<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Global Diplomacy Forum (GDF) is a community-run international diplomacy hub in Oman. Debate. Negotiate. Lead the World."
    />
    <meta name="theme-color" content="#F8F9FF" />
    <title>Global Diplomacy Forum | GDF Oman | Smart Diplomacy Hub</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('gdf-theme');
        if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0A0712');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
